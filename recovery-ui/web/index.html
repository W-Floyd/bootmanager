<!DOCTYPE html>
<!-- The browser front end, served by the phone's Remote UI service next to
     the wasm build (recovery_ui.js, recovery_ui_bg.wasm). Slint draws into
     the canvas with id "canvas"; src/web.rs connects to ws://<host>/ws. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fogona recovery</title>
<style>
  /* The canvas fills the window. Slint first sizes the window to its
     preferred 360x800 and winit writes that into the canvas's inline
     style; !important keeps this size instead, and winit's ResizeObserver
     then reports it, so Slint lays out to the real size -- on every later
     resize too. dvh keeps a mobile browser's collapsing address bar from
     hiding the bottom. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c100e; }
  canvas { display: block; outline: none; touch-action: none;
           width: 100vw !important; height: 100vh !important;
           height: 100dvh !important; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0"></canvas>
<script type="module">
  import init from "./recovery_ui.js";
  await init();
  document.getElementById("canvas").focus();
</script>
</body>
</html>
