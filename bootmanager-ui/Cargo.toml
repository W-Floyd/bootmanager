[package]
name = "bootmanager-ui"
version = "0.1.0"
edition = "2021"
publish = false

# Two builds of one UI, picked by feature; exactly one of them:
#   fbdev  the device's panel: a static binary with its own Slint platform
#          (fbdev + evdev, src/platform.rs), because a LinuxBoot stage has
#          no udev for libinput and no GPU userspace. Default.
#   web    wasm for a browser, served by the backend, over a WebSocket.
[features]
default = ["fbdev"]
fbdev = ["slint/renderer-software", "dep:i-slint-renderer-software", "dep:libc", "dep:evdev", "dep:png"]
web = ["slint/backend-winit", "slint/renderer-femtovg", "dep:wasm-bindgen", "dep:web-sys", "dep:console_error_panic_hook"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bootmanager-ui"
required-features = ["fbdev"]

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-18"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
percent-encoding = "2"
libc = { version = "0.2", optional = true }
evdev = { version = "0.13", optional = true }
png = { version = "0.17", optional = true }
# Must equal the version of the wasm-bindgen CLI that build.sh runs.
wasm-bindgen = { version = "=0.2.128", optional = true }
web-sys = { version = "0.3", optional = true, features = ["WebSocket", "MessageEvent", "Window", "Location", "Document", "Element", "HtmlAnchorElement", "History"] }
console_error_panic_hook = { version = "0.1", optional = true }
# Not used directly: turns on fontique's dlopen of fontconfig, which the
# slint crate does not expose. Linked, fontconfig would stop the fbdev
# binary being static; dlopened, it simply fails in the stage and the
# embedded fonts are used. Must match slint's version exactly.
i-slint-common = { version = "=1.18.1", features = ["fontconfig-dlopen"] }
# Not used directly either: "experimental" exposes TargetPixelBuffer, whose
# draw_rectangle hook lets platform.rs draw gradients itself, dithered.
i-slint-renderer-software = { version = "=1.18.1", features = ["experimental"], optional = true }

[build-dependencies]
slint-build = "1.18"
i-slint-common = { version = "=1.18.1", features = ["fontconfig-dlopen"] }

[profile.release]
# Not "s": the software renderer's per-pixel loops need inlining and
# vectorising. 3 renders the carousel about 20% faster on the device and
# presents in half the time, for 0.8 MB more binary.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
